{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Community Health Initiative{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{% static 'personal/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <a class="navbar__brand" href="{% url 'base' %}">
                <h1>KANTOSH GURUNG</h1>
            </a>
            <button class="navbar__toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="navbar__links" id="primary-navigation">
                <li><a href="{% url 'base' %}" {% if request.resolver_match.url_name == "base" %}aria-current="page"{% endif %}>Home</a></li>
                <li><a href="{% url 'programme' %}" {% if request.resolver_match.url_name == "programme" %}aria-current="page"{% endif %}>Programme</a></li>
                <li><a href="{% url 'objectives' %}" {% if request.resolver_match.url_name == "objectives" %}aria-current="page"{% endif %}>Objectives</a></li>
                <li><a href="{% url 'contributions' %}" {% if request.resolver_match.url_name == "contributions" %}aria-current="page"{% endif %}>Contributions</a></li>
                <li><a href="{% url 'health_news' %}" {% if request.resolver_match.url_name == "health_news" %}aria-current="page"{% endif %}>Health News</a></li>
                <li><a href="{% url 'team' %}" {% if request.resolver_match.url_name == "team" %}aria-current="page"{% endif %}>Our Team</a></li>
                <li><a href="{% url 'contact' %}" {% if request.resolver_match.url_name == "contact" %}aria-current="page"{% endif %}>Contact</a></li>
            </ul>
        </nav>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Community Health Initiative</p>
    </footer>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"
        integrity="sha512-aNMyYYxdIxIaot0Y1/PLuEu3eipGCmsEUBrUq+7aVyPGMFH8z0eTP0tkqAvv34fzN6z+201d3T8HPb1svWSKHQ=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        defer
    ></script>
    <script src="{% static 'js/home-carousel.js' %}" defer></script>
    <script src="{% static 'js/page-animations.js' %}" defer></script>
    <script>
        const header = document.querySelector("header");
        const navbar = document.querySelector(".navbar");
        const menuToggle = document.querySelector(".navbar__toggle");
        const navigation = document.querySelector(".navbar__links");
        const mobileNavigation = window.matchMedia("(max-width: 1100px)");

        document.documentElement.classList.add("js");

        const updateHeaderHeight = () => {
            header.style.height = `${navbar.offsetHeight}px`;
        };

        const setMenuOpen = (isOpen) => {
            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
            navigation.classList.toggle("is-open", isOpen);
            updateHeaderHeight();
        };

        menuToggle.addEventListener("click", () => {
            setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true");
        });

        navigation.addEventListener("click", (event) => {
            if (event.target.closest("a") && mobileNavigation.matches) {
                setMenuOpen(false);
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && menuToggle.getAttribute("aria-expanded") === "true") {
                setMenuOpen(false);
                menuToggle.focus();
            }
        });

        mobileNavigation.addEventListener("change", () => setMenuOpen(false));
        updateHeaderHeight();
        new ResizeObserver(updateHeaderHeight).observe(navbar);
    </script>
</body>
</html>
