{% extends "base.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <section class="contact-page" aria-labelledby="contact-title">
        <header class="contact-page__heading">
            <p class="eyebrow">Let’s connect</p>
            <h2 id="contact-title">{{ title }}</h2>
            <p>{{ intro }}</p>
        </header>
        <div class="contact-grid">
            <article class="contact-card">
                <span class="contact-card__label">
                    <img src="{% static 'images/email.png' %}" width="40" height="40" alt="Email">
                    <span>Email</span>
                </span>
                <a href="mailto:{{ email }}">{{ email }}</a>
            </article>
            <article class="contact-card">
                <span class="contact-card__label">
                    <img src="{% static 'images/whatsapp.png' %}" width="40" height="40" alt="WhatsApp">
                    <span>Mobile/Whatsapp</span>
                </span>
                <a href="tel:{{ phone }}">{{ phone }}</a>
            </article>
            <article class="contact-card">
                <span class="contact-card__label">
                    <img src="{% static 'images/map.png' %}" width="40" height="40" alt="Map">
                    <span>Location</span>
                </span>
                <p>{{ location }}</p>
            </article>
        </div>
    </section>
{% endblock %}
